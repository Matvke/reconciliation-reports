{% extends 'base.html' %}

{% block content %}
<h1>{{ title }}</h1>
<div class="card mb-3">
    <div class="card-body">
        <a href="{ create_url_name }">{{ create_text }}</a>
    </div>
</div>

{% for item in items %}
<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title"><a href="{% url detail_url_name item.pk %}">{% block item_title %}{% endblock %}</a></h5>
        <p class="card-text"><a href="{% url update_url_name item.pk %}">Изменить</a></p>
        <p class="card-text"><a href="{% url delete_url_name item.pk %}">Удалить</a></p>
    </div>
</div>
{% endfor %}

{% include 'partials/pagination.html' %}
{% endblock %}
